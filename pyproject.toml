[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-scout"
version = "0.1.0"
description = "Niche Opportunity & Validation Analyzer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[project.scripts]
nova = "nova_scout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nova_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
